name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project Notchless.xcodeproj \
            -scheme Notchless \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test
        run: |
          xcodebuild \
            -project Notchless.xcodeproj \
            -scheme Notchless \
            -configuration Debug \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Package application
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            DerivedData/Build/Products/Release/Notchless.app \
            Notchless.zip

      - name: Create release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          date_version="$(date -u +'%Y.%m.%d')"
          tags_endpoint="repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v${date_version}."
          existing_count="$(
            gh api --paginate "$tags_endpoint" --jq 'length' 2>/dev/null |
              awk '{ total += $1 } END { print total + 0 }'
          )"
          sequence="$((existing_count + 1))"
          tag="v${date_version}.${sequence}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "name=Notchless ${date_version}.${sequence}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NAME: ${{ steps.version.outputs.name }}
        run: |
          gh release create "$TAG" Notchless.zip \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --generate-notes
