name: Notchless
options:
  bundleIdPrefix: com.notchless
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSUIElement: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.notchless.app
    PRODUCT_NAME: Notchless
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Notchless:
    type: application
    platform: macOS
    sources:
      - path: Notchless
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: Notchless
  NotchlessTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NotchlessTests
    dependencies:
      - target: Notchless
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notchless.tests
        PRODUCT_NAME: NotchlessTests
        PRODUCT_MODULE_NAME: NotchlessTests
schemes:
  Notchless:
    build:
      targets:
        Notchless: all
        NotchlessTests: [test]
    test:
      targets:
        - NotchlessTests
